<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Best DataBase - Studio</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>

  <!-- ==========================================
       ESTRUCTURA PRINCIPAL DE LA APLICACIÓN (STUDIO)
       ========================================== -->
  <div class="app-container" id="appContainer">
    
    <!-- Barra Superior / Nombre de App y Perfil -->
    <header class="app-header">
      <div class="brand">My Best <strong>DataBase</strong></div>
      <div class="user-profile">
        <span id="userNameDisplay">USUARIO</span>
        <button class="btn" onclick="handleLogout()">Cerrar Sesión</button>
      </div>
    </header>

    <!-- Barra de Herramientas Principal -->
    <div class="action-toolbar">
      <button class="btn btn-primary" onclick="runCurrentQuery()">▶ Ejecutar SQL</button>
      <button class="btn" onclick="openConverterModal()">🔄 Conversor de Datos</button>
      <button class="btn" onclick="openModal('Nueva Conexión', 'Configura tu servidor MySQL, PostgreSQL o SQLite.')">+ Nueva DB</button>
    </div>

    <!-- Espacio de Trabajo Principal -->
    <div class="workspace">
      
      <!-- Explorador Lateral de Bases de Datos -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <input type="text" class="search-input" placeholder="Buscar tablas, esquemas...">
        </div>
        <div class="tree-view" id="treeView">
          <!-- Carga dinámicamente desde app.js -->
        </div>
      </aside>

      <!-- Escenario Central (Editor y Resultados) -->
      <main class="main-stage">
        
        <!-- Pestañas de Trabajo -->
        <div class="tab-bar">
          <div class="tab active" id="tab-btn-editor" onclick="switchTab('tab-editor')">Editor SQL</div>
          <div class="tab" id="tab-btn-er" onclick="switchTab('tab-er')">Diagrama ER</div>
        </div>

        <!-- Contenido 1: Editor SQL -->
        <div class="tab-content active" id="tab-editor">
          <div class="editor-pane">
            <div class="line-numbers" id="lineNumbers">1</div>
            <textarea id="sqlEditor" class="code-editor" spellcheck="false" placeholder="-- Escribe tus consultas SQL aquí&#10;SELECT * FROM usuarios;"></textarea>
          </div>

          <!-- Panel de Resultados / Consola -->
          <div class="results-pane">
            <div class="results-navbar">
              <div class="results-tab active" id="btn-show-grid" onclick="toggleResultView('grid')">Resultados Grid</div>
              <div class="results-tab" id="btn-show-log" onclick="toggleResultView('log')">Consola de Salida</div>
            </div>

            <div class="data-grid-container" id="view-grid">
              <table class="data-table">
                <thead id="gridHead">
                  <tr><th>Mensaje</th></tr>
                </thead>
                <tbody id="gridBody">
                  <tr><td>Ejecuta una consulta SQL para mostrar resultados.</td></tr>
                </tbody>
              </table>
            </div>

            <div class="log-container" id="view-log">
              <div class="log-entry info">[SISTEMA] Listo para ejecutar consultas.</div>
            </div>
          </div>
        </div>

        <!-- Contenido 2: Diagrama ER -->
        <div class="tab-content" id="tab-er">
          <div class="diagram-canvas" id="diagramCanvas"></div>
        </div>

        <!-- Barra de Estado Inferior -->
        <footer class="status-bar">
          <span>Servidor: Localhost</span>
          <span id="footerMetrics">Filas: 0 | Tiempo: 0ms</span>
        </footer>
      </main>
    </div>
  </div>

  <!-- ==========================================
       MODAL: CONVERSOR DE DATOS
       ========================================== -->
  <div class="modal-overlay" id="converterModal">
    <div class="modal" style="width: 600px;">
      <div class="modal-header">Conversor de Formatos de Datos</div>
      <div class="modal-body">
        <label style="font-weight: bold; display: block; margin-bottom: 6px;">Entrada:</label>
        <textarea id="converterInput" class="form-control" style="width: 100%; height: 100px; font-family: monospace;" placeholder='Pega aquí tu JSON, CSV o texto...'></textarea>
        
        <div style="display: flex; gap: 8px; margin: 12px 0;">
          <button class="btn" onclick="convertData('json-to-sql')">JSON a SQL</button>
          <button class="btn" onclick="convertData('excel-to-sql')">CSV a SQL</button>
          <button class="btn" onclick="convertData('json-to-markdown')">JSON a Markdown</button>
        </div>

        <label style="font-weight: bold; display: block; margin-bottom: 6px;">Resultado:</label>
        <textarea id="converterOutput" class="form-control" style="width: 100%; height: 120px; font-family: monospace;" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="copyConverterOutput()">Copiar Resultado</button>
        <button class="btn" onclick="closeConverterModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       MODAL GENÉRICO
       ========================================== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header" id="modalTitle">Mensaje</div>
      <div class="modal-body" id="modalBody">Contenido del mensaje</div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeModal()">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
